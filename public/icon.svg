<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#18202f"/>
      <stop offset="60%" stop-color="#0e131d"/>
      <stop offset="100%" stop-color="#080b11"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Solid App Tile Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Border Contour -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Tactical Concentric Reticle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="140" fill="url(#innerGrad)" stroke="#334155" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Minimalist Cipher Eye / Reticle Shape -->
  <g filter="url(#subtleGlow)">
    <!-- Stealth Shield/Lens Outer Arc -->
    <path d="M 160 256 C 188 190, 324 190, 352 256 C 324 322, 188 322, 160 256 Z" 
          fill="#0f172a" stroke="url(#ringGrad)" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Central Cryptographic Core -->
    <circle cx="256" cy="256" r="44" fill="#090d16" stroke="#f43f5e" stroke-width="6"/>
    <circle cx="256" cy="256" r="18" fill="#f43f5e"/>

    <!-- Subtle Crosshair Marks -->
    <line x1="256" y1="170" x2="256" y2="195" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>
    <line x1="256" y1="317" x2="256" y2="342" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>
    <line x1="125" y1="256" x2="150" y2="256" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
    <line x1="362" y1="256" x2="387" y2="256" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
  </g>
</svg>
